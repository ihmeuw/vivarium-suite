[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium-public-health"
description = "Components for modeling diseases, risks, and interventions with ``vivarium``."
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dynamic = ["version"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "vivarium-dependencies[pandas,numpy,scipy,tables,loguru,pyarrow]",
    "vivarium-build-utils>=4.0.0,<5.0.0",
    "vivarium-engine>=5.2.0",
    "vivarium-config-tree>=5.0.0",
    "vivarium-risk-distributions>=3.0.0,<4.0.0",
]

[project.optional-dependencies]
test = [
    "vivarium-dependencies[pytest]",
    "pytest-vivarium",
    "vivarium-fuzzy-checker",
    "hypothesis",
    "pyyaml",
]
docs = ["vivarium-dependencies[sphinx,sphinx-click,ipython,matplotlib]"]
interactive = ["vivarium-dependencies[interactive]"]
lint = ["vivarium-dependencies[lint]"]
cluster = []
dev = ["vivarium-public-health[test,docs,interactive,lint]"]
ci_github = ["vivarium-public-health[test,docs,lint]"]
ci_jenkins = ["vivarium-public-health[ci_github,cluster]"]

[project.urls]
Homepage = "https://github.com/ihmeuw/vivarium-suite"
Source = "https://github.com/ihmeuw/vivarium-suite/tree/main/libs/public-health"

[tool.vivarium.python-support]
candidates = ["3.14"]

[tool.setuptools.packages.find]
where = ["src"]
# Only include vivarium.public_health and its subpackages. Excluding vivarium
# itself means the wheel does not ship vivarium/__init__.py. The "namespace
# owner" (vivarium-engine) ships the canonical vivarium/__init__.py. If we
# shipped our own here, pip would overwrite the canonical one.
include = ["vivarium.public_health", "vivarium.public_health.*"]

[tool.setuptools.package-data]
# Ship the py.typed marker (PEP 561) so mypy treats this package as typed when
# users install it from PyPI and so mypy also finds the marker via the
# editable install during in-repo type checks.
"vivarium.public_health" = ["py.typed"]

[tool.setuptools_scm]
# Monorepo tagging convention: tags must be prefixed with "vivarium-public-health-v"
# (e.g. vivarium-public-health-v5.2.0). tag_regex strips the prefix so setuptools_scm
# sees a clean semver; git_describe_command filters to only this lib's tags so siblings'
# releases don't pollute the version derivation.
root = "../.."
tag_regex = '^vivarium-public-health-v(?P<version>[^\+]+)$'
git_describe_command = 'git describe --dirty --tags --long --match "vivarium-public-health-v*"'
fallback_version = "0.0.0+no-git-tag"

[tool.black]
line-length = 94

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3

[tool.pytest.ini_options]
# Pin the pytest rootdir contract: tests import from each other using absolute
# `from tests.X` paths, which only resolve when pytest's rootdir is this lib.
# Declaring testpaths here makes monorepo-root invocations (pytest libs/public-health/)
# work the same as in-lib invocations.
testpaths = ["tests"]

[tool.coverage.run]
source = ["vivarium.public_health"]

[tool.coverage.report]
show_missing = true

[tool.mypy]
# WARNING: settings here that aren't mypy_path / explicit_package_bases must be
# kept in sync manually with the monorepo-root [tool.mypy]. The local
# `make mypy` passes --config-file pyproject.toml (this file), so mypy doesn't
# read the root config. If you change the root, change this too.
#
# mypy_path lets absolute self-imports (e.g. "from vivarium.config_tree import X")
# resolve to the source tree rather than the PEP 660 editable install (which
# hides files like py.typed behind a finder, making mypy think the package is
# untyped).
strict = true
disallow_any_unimported = false
implicit_reexport = true
exclude = ["build"]
mypy_path = "src"
explicit_package_bases = true
