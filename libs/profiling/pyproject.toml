[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium-profiling"
description = "Profiling and benchmarking tools for Vivarium simulations."
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dynamic = ["version"]
dependencies = [
    # vivarium-compat is a transitional dep: it installs the import hook that
    # redirects `import vivarium_profiling` to `vivarium.profiling`. Declaring
    # it here means anyone pulling in vivarium-profiling ends up with the redirect
    # in place. When compat is eventually retired (see
    # libs/compat/tests/test_removal_deadline.py) we drop this entry in a major
    # version bump.
    "vivarium-compat>=0.3.1",
    "vivarium-dependencies[pandas,numpy,scipy,click,tables,loguru]",
    "vivarium-build-utils>=3.0.2,<4.0.0",
    "vivarium-gbd-mapping>=6.0.0",
    "vivarium>=4.1.2",
    "vivarium-public-health>=5.0.0",
    "vivarium-config-tree>=5.0.1",
    "jinja2",
    "pyyaml",
    "memory-profiler",
    "matplotlib",
    "seaborn",
    "scalene",
    "nbformat>=5.0",
]

[project.optional-dependencies]
test = [
    "vivarium-dependencies[pytest]",
    "vivarium-testing-utils",
]
cluster = ["vivarium-cluster-tools>=2.1.17"]
docs = []
data = [
    "vivarium-inputs>=5.2.6",
    "vivarium-profiling[cluster]",
]
interactive = ["vivarium-dependencies[interactive]"]
lint = ["vivarium-dependencies[lint]"]
dev = ["vivarium-profiling[test,cluster,interactive,lint]"]
ci_github = ["vivarium-profiling[test,docs,lint]"]
ci_jenkins = ["vivarium-profiling[ci_github,cluster]"]

[project.scripts]
make_artifacts = "vivarium.profiling.tools.cli:make_artifacts"
run_benchmark = "vivarium.profiling.tools.cli:run_benchmark"
profile_sim = "vivarium.profiling.tools.cli:profile_sim"
summarize = "vivarium.profiling.tools.cli:summarize"

[tool.setuptools.packages.find]
where = ["src"]
# Only include vivarium.profiling and its subpackages. Excluding vivarium itself
# means the wheel does not ship vivarium/__init__.py. The "namespace owner"
# (standalone vivarium today, vivarium-core post-monorepo-migration) ships the
# canonical vivarium/__init__.py with backward-compat re-exports. If we shipped
# our own here, pip would overwrite the canonical one and break imports like
# `from vivarium import Component`.
include = ["vivarium.profiling*"]

[tool.setuptools.package-data]
# Ship the py.typed marker (PEP 561) so mypy treats this package as typed when
# users install it from PyPI and so mypy also finds the marker via the
# editable install during in-repo type checks.
"vivarium.profiling" = ["py.typed"]

[tool.setuptools_scm]
# Monorepo tagging convention: tags are prefixed with "vivarium-profiling-"
# (e.g. vivarium-profiling-v0.4.0). tag_regex strips the prefix so
# setuptools_scm sees a clean semver; git_describe_command filters to only
# this lib's tags so siblings' releases don't pollute the version derivation.
root = "../.."
tag_regex = '^vivarium-profiling-(?P<prefix>v)?(?P<version>[^\+]+)(?P<suffix>.*)?$'
git_describe_command = 'git describe --dirty --tags --long --match "vivarium-profiling-v*"'
fallback_version = "0.0.0+no-git-tag"

[tool.black]
line-length = 94

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3

[tool.mypy]
# WARNING: settings here that aren't mypy_path / explicit_package_bases must be
# kept in sync manually with the monorepo-root [tool.mypy]. The local
# `make mypy` passes --config-file pyproject.toml (this file), so mypy doesn't
# read the root config. If you change the root, change this too.
#
# mypy_path lets absolute self-imports (e.g. "from vivarium.config_tree import X")
# resolve to the source tree rather than the PEP 660 editable install (which
# hides files like py.typed behind a finder, making mypy think the package is
# untyped).
strict = true
disallow_any_unimported = false
implicit_reexport = true
exclude = ["build"]
mypy_path = "src"
explicit_package_bases = true
