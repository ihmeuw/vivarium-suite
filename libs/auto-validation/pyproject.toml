[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium-auto-validation"
description = "Automated verification and validation tooling for Vivarium simulations."
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dynamic = ["version"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "vivarium-dependencies[numpy,pandas,loguru,pyyaml]",
    "vivarium-build-utils>=4.0.0,<5.0.0",
    "vivarium-config-tree",
    "vivarium-fuzzy-checker",
]

[project.optional-dependencies]
cluster = []
test = [
    "vivarium-dependencies[pytest]",
    "pytest-check",
    # For the pytest plugin (the `--runslow`/`--runweekly` options and the
    # `-n auto` worker cap that `make test-all` relies on). To be repointed at
    # vivarium-pytest-plugins once that package is extracted (MIC-7033 PR3).
    "vivarium-testing-utils",
]
docs = ["vivarium-dependencies[sphinx,sphinx-click,ipython,matplotlib,docutils]"]
interactive = ["vivarium-dependencies[interactive]"]
# Internal extra so both `lint` (for mypy's pandera.mypy plugin) and `validation`
# (the runtime feature) can pin pandera from one place.
pandera = ["pandera<0.23.0"]
# `[pandera]` is here so mypy's `pandera.mypy` plugin loads on ci_github (which
# only installs `[test,docs,lint]` and skips `validation`).
lint = ["vivarium-dependencies[lint]", "vivarium-auto-validation[pandera]"]
# Validation feature: pulled in only by Jenkins (ci_jenkins) because
# vivarium-inputs is IHME-artifactory-only and unreachable from GH Actions.
validation = [
    "vivarium-artifact",
    "vivarium-gbd-mapping",
    "vivarium-inputs>=8.0.0,<9.0.0",
    "vivarium-auto-validation[pandera]",
    "pyarrow",
    "seaborn",
    "jinja2>=3.0.0",
    # matplotlib/ipython are imported unconditionally by the feature (plotting
    # and in-notebook HTML report display), so they belong here rather than only
    # in `docs`, or `pip install vivarium-auto-validation[validation]` can't
    # import the package.
    "vivarium-dependencies[matplotlib,ipython]",
]
dev = ["vivarium-auto-validation[test,docs,interactive,lint,validation]"]
ci_github = ["vivarium-auto-validation[test,docs,lint]"]
# Diverges from the sibling convention `[ci_github,cluster]` by adding
# `validation`: Jenkins is the only env that can install vivarium-inputs, so it
# also runs the validation feature's tests + mypy with real types.
ci_jenkins = ["vivarium-auto-validation[ci_github,cluster,validation]"]

[tool.setuptools.packages.find]
where = ["src"]
# Only include vivarium.auto_validation and its subpackages. Excluding vivarium
# itself means the wheel does not ship vivarium/__init__.py, which is owned by
# vivarium-engine; two distributions writing the same file would clobber each
# other at install time.
include = ["vivarium.auto_validation", "vivarium.auto_validation.*"]

[tool.setuptools.package-data]
# Ship the py.typed marker (PEP 561) so mypy treats this package as typed when
# users install it from PyPI and so mypy also finds the marker via the
# editable install during in-repo type checks. Also ship the HTML report
# template consumed at runtime by the report generator.
"vivarium.auto_validation" = ["py.typed", "templates/*.html"]

[tool.setuptools_scm]
# Monorepo tagging convention: tags must be prefixed with "vivarium-auto-validation-v"
# (e.g. ``vivarium-auto-validation-v0.1.0``). tag_regex strips the prefix so
# setuptools_scm sees a clean semver; git_describe_command filters to only this
# lib's tags so siblings' releases don't pollute the version derivation.
root = "../.."
tag_regex = '^vivarium-auto-validation-v(?P<version>[^\+]+)$'
git_describe_command = 'git describe --dirty --tags --long --match "vivarium-auto-validation-v*"'
fallback_version = "0.0.0+no-git-tag"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 94
exclude = '''.*examples.*'''

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3
skip_glob = ["*/examples/*", "**/examples/*"]

[tool.mypy]
# WARNING: settings here that aren't mypy_path / explicit_package_bases must be
# kept in sync manually with the monorepo-root [tool.mypy]. The local
# `make mypy` passes --config-file pyproject.toml (this file), so mypy doesn't
# read the root config. If you change the root, change this too.
strict = true
disallow_any_unimported = false
implicit_reexport = true
exclude = [
    "build",
    "docs/source/conf.py",
    "src/vivarium/auto_validation/visualization/plot_utils.py",  # Only stubbed out currently
]
plugins = ["pandera.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# Two reasons something might land here:
#   1. Upstream lacks py.typed/stubs entirely (scipy, py._path.local, pandera,
#      vivarium-gbd-mapping).
#   2. The dep lives in the `validation` extra and is not installed on
#      ci_github (vivarium-inputs is artifactory-only; vivarium-artifact is
#      pulled in transitively only via `validation`). With this override
#      mypy treats them as Any on ci_github. On Jenkins (which installs
#      `validation`) the imports resolve and mypy uses the real py.typed
#      types — `ignore_missing_imports` is a no-op when the module is
#      actually findable, so this does NOT mask Jenkins type errors.
module = [
    "py._path.local",
    "scipy.*",
    "pandera.*",
    "vivarium_inputs.*",
    "vivarium.artifact.*",
    "vivarium.gbd_mapping.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["vivarium.auto_validation"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
