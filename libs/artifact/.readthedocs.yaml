# Paths are repo-root-relative even when this file lives in a subdirectory,
# so the package path must be qualified with libs/artifact/.
#
# This file is read by RTD only when the vivarium-artifact RTD project's
# Admin > Advanced Settings > "Path for .readthedocs.yaml" points here. The
# root-level /.readthedocs.yaml is a placeholder used by the import wizard
# and ignored for any project that has overridden the path.
version: 2

sphinx:
  configuration: libs/artifact/docs/source/conf.py
  fail_on_warning: true

build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      - git fetch --depth=1 origin main || true
      # Cancel PR (external) builds that don't touch this lib (Exit 183 is RTD's
      # signal to cancel the build immediately).
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet "origin/main...HEAD" -- libs/artifact/; then
          echo "Skipping docs build: this PR changes nothing under libs/artifact/."
          exit 183
        fi

python:
  install:
    - method: pip
      path: libs/artifact
      extra_requirements:
        - docs

formats:
  - pdf
