[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium-interactive"
description = "Run and inspect vivarium simulations interactively, for example in a notebook."
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dynamic = ["version"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "vivarium-engine>=6.0.0",
    "vivarium-config-tree",
    "vivarium-dependencies[numpy,pandas]",
    "vivarium-build-utils>=4.0.0,<5.0.0",
]

[project.optional-dependencies]
interactive = ["vivarium-dependencies[interactive]"]
test = [
    "vivarium-dependencies[pytest,networkx,pyyaml,loguru,ipython]",
    "pytest-vivarium",
    "vivarium-fuzzy-checker",
]
docs = ["vivarium-dependencies[sphinx]"]
lint = ["vivarium-dependencies[lint]"]
dev = ["vivarium-interactive[docs,interactive,test,lint]"]
cluster = []
ci_github = ["vivarium-interactive[test,docs,lint]"]
ci_jenkins = ["vivarium-interactive[ci_github,cluster]"]

[project.urls]
Homepage = "https://github.com/ihmeuw/vivarium-suite"
Source = "https://github.com/ihmeuw/vivarium-suite/tree/main/libs/interactive"

[tool.vivarium.python-support]
candidates = ["3.14"]

[tool.setuptools.packages.find]
where = ["src"]
# Only include vivarium.interactive and its subpackages. Excluding vivarium
# itself means the wheel does not ship vivarium/__init__.py, which is owned by
# vivarium-engine; two distributions writing the same file would clobber each
# other at install time.
include = ["vivarium.interactive", "vivarium.interactive.*"]

[tool.setuptools.package-data]
"vivarium.interactive" = ["py.typed"]

[tool.setuptools_scm]
# Monorepo tagging convention: tags must be prefixed with "vivarium-interactive-v"
# (e.g. ``vivarium-interactive-v1.0.0``). tag_regex strips the prefix so
# setuptools_scm sees a clean semver; git_describe_command filters to only this
# lib's tags so siblings' releases don't pollute the version derivation.
root = "../.."
tag_regex = '^vivarium-interactive-v(?P<version>[^\+]+)$'
git_describe_command = 'git describe --dirty --tags --long --match "vivarium-interactive-v*"'
fallback_version = "0.0.0+no-git-tag"

[tool.black]
line-length = 94

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3
known_first_party = ["vivarium.interactive"]
known_third_party = ["vivarium.config_tree", "vivarium.engine"]

[tool.mypy]
# WARNING: settings here that aren't mypy_path / explicit_package_bases must be
# kept in sync manually with the monorepo-root [tool.mypy]. The local
# `make mypy` passes --config-file pyproject.toml (this file), so mypy doesn't
# read the root config. If you change the root, change this too.
strict = true
disallow_any_unimported = false
implicit_reexport = true
exclude = ["build"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# 3rd-party packages that don't ship type stubs.
module = [
    "ipywidgets.*",
    "IPython.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests/"]

[tool.coverage.run]
source = ["vivarium.interactive"]

[tool.coverage.report]
show_missing = true
