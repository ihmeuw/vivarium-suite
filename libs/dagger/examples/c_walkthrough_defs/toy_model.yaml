# A toy vivarium model for the track C walkthrough: 1,000 simulants, two weekly time steps,
# a mortality component and a deaths observer. tests/frontend/simulation_example/toy_model.yaml
# with 1,000 simulants instead of 10, so that some die, and an input_data section.
components:
  vivarium.engine.examples.disease_model:
    population:
      - BasePopulation()
    observer:
      - DeathsObserver()
configuration:
  # psimulate's -i adds the artifact path to this section, so it must exist, as it does in
  # a model's own specification.
  input_data:
    location: Toyland
  time:
    start:
      year: 2025
      month: 1
      day: 1
    end:
      year: 2025
      month: 1
      day: 15
    step_size: 7  # days
  population:
    population_size: 1000
  randomness:
    key_columns: []
  mortality:
    mortality_rate: 0.1
