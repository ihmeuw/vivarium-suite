# Paths are repo-root-relative even when this file lives in a subdirectory,
# so the package path must be qualified with libs/dagger/.
#
# This file is read by RTD only when the vivarium-dagger RTD
# project's Admin > Advanced Settings > "Path for .readthedocs.yaml" points
# here. The root-level /.readthedocs.yaml is a placeholder used by the
# import wizard and ignored for any project that has overridden the path.
version: 2

sphinx:
  configuration: libs/dagger/docs/source/conf.py
  fail_on_warning: true

build:
  os: ubuntu-22.04
  tools:
    python: "3.13"
  jobs:
    post_checkout:
      - git fetch --unshallow origin 2>/dev/null || git fetch origin main
      # Cancel PR (external) builds that don't touch this lib (Exit 183 is RTD's
      # signal to cancel the build immediately).
      - |
        if [ "$READTHEDOCS_VERSION_TYPE" = "external" ] && git diff --quiet "origin/main...HEAD" -- libs/dagger/; then
          echo "Skipping docs build: this PR changes nothing under libs/dagger/."
          exit 183
        fi
    pre_install:
      # RTD installs dependencies from PyPI. Install cluster-tools from the tree first, at
      # the version its CHANGELOG is about to release, so the docs build before that
      # release reaches PyPI (setuptools_scm alone would give it the previous tag's version).
      - SETUPTOOLS_SCM_PRETEND_VERSION_FOR_VIVARIUM_CLUSTER_TOOLS=$(grep -m1 -oE '[0-9]+\.[0-9]+\.[0-9]+' libs/cluster-tools/CHANGELOG.rst) "$READTHEDOCS_VIRTUALENV_PATH/bin/python" -m pip install ./libs/cluster-tools

python:
  install:
    - method: pip
      path: libs/dagger
      extra_requirements:
        - docs

formats:
  - pdf
