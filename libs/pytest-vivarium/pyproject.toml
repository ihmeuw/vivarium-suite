[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-vivarium"
description = "Shared pytest configuration and fixtures for Vivarium projects."
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dynamic = ["version"]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # NOTE: Must import pytest as runtime dep in order to auto-load plugins
    "vivarium-dependencies[pytest,numpy]",
    "vivarium-build-utils>=4.0.0,<5.0.0",
    "vivarium-config-tree",
]

[project.optional-dependencies]
cluster = []
test = []
docs = ["vivarium-dependencies[sphinx,docutils]"]
interactive = []
lint = ["vivarium-dependencies[lint]"]
dev = ["pytest-vivarium[test,docs,interactive,lint]"]
ci_github = ["pytest-vivarium[test,docs,lint]"]
ci_jenkins = ["pytest-vivarium[ci_github,cluster]"]

[project.entry-points.pytest11]
pytest_vivarium = "pytest_vivarium.plugin"

[project.urls]
Homepage = "https://github.com/ihmeuw/vivarium-suite"
Source = "https://github.com/ihmeuw/vivarium-suite/tree/main/libs/pytest-vivarium"

[tool.vivarium.python-support]
candidates = ["3.14"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pytest_vivarium", "pytest_vivarium.*"]

[tool.setuptools.package-data]
# Ship the py.typed marker (PEP 561) so mypy treats this package as typed when
# users install it from PyPI and so mypy also finds the marker via the editable
# install during in-repo type checks.
"pytest_vivarium" = ["py.typed"]

[tool.setuptools_scm]
# Monorepo tagging convention: tags must be prefixed with "pytest-vivarium-v"
# (e.g. pytest-vivarium-v0.1.0). tag_regex strips the prefix so setuptools_scm
# sees a clean semver; git_describe_command filters to only this lib's tags so
# siblings' releases don't pollute the version derivation.
root = "../.."
tag_regex = '^pytest-vivarium-v(?P<version>[^\+]+)$'
git_describe_command = 'git describe --dirty --tags --long --match "pytest-vivarium-v*"'
fallback_version = "0.0.0+no-git-tag"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 94

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3

[tool.mypy]
# WARNING: settings here that aren't mypy_path / explicit_package_bases must be
# kept in sync manually with the monorepo-root [tool.mypy]. The local
# `make mypy` passes --config-file pyproject.toml (this file), so mypy doesn't
# read the root config. If you change the root, change this too.
strict = true
disallow_any_unimported = false
implicit_reexport = true
exclude = [
    "build",
    "docs/source/conf.py",
]
mypy_path = "src"
explicit_package_bases = true

[tool.coverage.run]
source = ["pytest_vivarium"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
