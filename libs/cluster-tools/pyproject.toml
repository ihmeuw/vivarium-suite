[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium-cluster-tools"
description = "A set of tools for running simulation using vivarium on cluster."
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dynamic = ["version"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "vivarium-dependencies[numpy_lt_2,pandas,pyyaml,click,tables,loguru,pyarrow,requests]",
    "vivarium-build-utils>=4.0.0,<5.0.0",
    "vivarium-engine>=5.1.0",
    "vivarium-config-tree>=5.0.0",
    "dill",
    "psutil",
]

[project.optional-dependencies]
# jobmon_installer_ihme (which in turn installs jobmon) is gated behind `[cluster]`
# because jobmon 3.2.4 (latest) imports `pkg_resources` which was removed in setuptools
# 80+ and is absent from Python 3.13's default install. Forcing jobmon onto every
# install breaks local dev on 3.13, but on the cluster the installer pins a tested
# jobmon and sidesteps the issue.
cluster = ["jobmon_installer_ihme"]
test = [
    "vivarium-dependencies[pytest]",
    "pytest-vivarium",
]
docs = ["vivarium-dependencies[sphinx,sphinx-click,ipython,matplotlib]"]
interactive = ["vivarium-dependencies[interactive]"]
lint = [
    "vivarium-dependencies[lint]",
    "types-setuptools",
    "types-psutil",
    "pyarrow-stubs",
]
dev = ["vivarium-cluster-tools[test,docs,interactive,lint,cluster]"]
ci_github = ["vivarium-cluster-tools[test,docs,lint]"]
ci_jenkins = ["vivarium-cluster-tools[ci_github,cluster]"]

[project.scripts]
psimulate = "vivarium.cluster_tools.psimulate.cli:psimulate"
dagger = "vivarium.cluster_tools.dagger.cli:dagger"
vipin = "vivarium.cluster_tools.vipin.cli:vipin"

[tool.setuptools.packages.find]
where = ["src"]
# Only include vivarium.cluster_tools and its subpackages. Excluding vivarium
# itself means the wheel does not ship vivarium/__init__.py. The "namespace
# owner" (vivarium-engine) ships the canonical vivarium/__init__.py. If we
# shipped our own here, pip would overwrite the canonical one.
include = ["vivarium.cluster_tools", "vivarium.cluster_tools.*"]

[tool.setuptools.package-data]
# Ship the py.typed marker (PEP 561) so mypy treats this package as typed when
# users install it from PyPI and so mypy also finds the marker via the
# editable install during in-repo type checks.
"vivarium.cluster_tools" = ["py.typed"]

[tool.setuptools_scm]
# Monorepo tagging convention: tags must be prefixed with "vivarium-cluster-tools-v"
# (e.g. vivarium-cluster-tools-v3.2.0). tag_regex strips the prefix so setuptools_scm
# sees a clean semver; git_describe_command filters to only this lib's tags so siblings'
# releases don't pollute the version derivation.
root = "../.."
tag_regex = '^vivarium-cluster-tools-v(?P<version>[^\+]+)$'
git_describe_command = 'git describe --dirty --tags --long --match "vivarium-cluster-tools-v*"'
fallback_version = "0.0.0+no-git-tag"

[tool.black]
line-length = 94

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3

[tool.mypy]
# WARNING: settings here that aren't mypy_path / explicit_package_bases must be
# kept in sync manually with the monorepo-root [tool.mypy]. The local
# `make mypy` passes --config-file pyproject.toml (this file), so mypy doesn't
# read the root config. If you change the root, change this too.
#
# mypy_path lets absolute self-imports (e.g. "from vivarium.cluster_tools import X")
# resolve to the source tree rather than the PEP 660 editable install (which
# hides files like py.typed behind a finder, making mypy think the package is
# untyped).
strict = true
disallow_any_unimported = false
implicit_reexport = true
exclude = ["build"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# jobmon is in [cluster], which [ci_github] doesn't install — see the
# rationale on the `cluster` extra above. Mute "Cannot find implementation"
# so mypy can still check the rest of the source on non-cluster envs.
module = ["dill", "jobmon.*", "jobmon_installer_ihme.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["vivarium.cluster_tools"]

[tool.coverage.report]
show_missing = true
