# Paths are repo-root-relative even when this file lives in a subdirectory,
# so the package path must be qualified with libs/risk-distributions/.
version: 2

sphinx:
  configuration: libs/risk-distributions/docs/source/conf.py
  fail_on_warning: true

build:
  os: ubuntu-22.04
  tools:
    python: "3.13"

python:
  install:
    - method: pip
      path: libs/risk-distributions
      extra_requirements:
        - docs

formats:
  - pdf
