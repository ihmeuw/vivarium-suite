[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium-validation"
description = "Automated verification and validation tooling for Vivarium simulations."
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dynamic = ["version"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "vivarium-dependencies[numpy,pandas,loguru,pyyaml,matplotlib,ipython,pyarrow]",
    "vivarium-build-utils>=4.0.0,<5.0.0",
    "vivarium-artifact",
    "vivarium-config-tree",
    "vivarium-fuzzy-checker>=0.3.0",
    "vivarium-gbd-mapping>=6.0.0",
    "jinja2>=3.0.0",
    "pandera<0.23.0",
    "seaborn",
]

[project.optional-dependencies]
cluster = []
test = [
    "vivarium-dependencies[pytest]",
    "pytest-check",
    # For the pytest plugin (the `--runslow`/`--runweekly` options and the
    # `-n auto` worker cap that `make test-all` relies on).
    "pytest-vivarium",
]
docs = ["vivarium-dependencies[sphinx,sphinx-click,ipython,matplotlib,docutils]"]
interactive = ["vivarium-dependencies[interactive]"]
lint = ["vivarium-dependencies[lint]"]
gbd = ["vivarium-inputs>=8.0.0"]
dev = ["vivarium-validation[test,docs,interactive,lint,gbd]"]
ci_github = ["vivarium-validation[test,docs,lint]"]
ci_jenkins = ["vivarium-validation[ci_github,cluster,gbd]"]

[project.urls]
Homepage = "https://github.com/ihmeuw/vivarium-suite"
Source = "https://github.com/ihmeuw/vivarium-suite/tree/main/libs/validation"

[tool.setuptools.packages.find]
where = ["src"]
# Only include vivarium.validation and its subpackages. Excluding vivarium
# itself means the wheel does not ship vivarium/__init__.py, which is owned by
# vivarium-engine; two distributions writing the same file would clobber each
# other at install time.
include = ["vivarium.validation", "vivarium.validation.*"]

[tool.setuptools.package-data]
# Ship the py.typed marker (PEP 561) so mypy treats this package as typed when
# users install it from PyPI and so mypy also finds the marker via the
# editable install during in-repo type checks. Also ship the HTML report
# template consumed at runtime by the report generator.
"vivarium.validation" = ["py.typed", "templates/*.html"]

[tool.setuptools_scm]
# Monorepo tagging convention: tags must be prefixed with "vivarium-validation-v"
# (e.g. ``vivarium-validation-v0.1.0``). tag_regex strips the prefix so
# setuptools_scm sees a clean semver; git_describe_command filters to only this
# lib's tags so siblings' releases don't pollute the version derivation.
root = "../.."
tag_regex = '^vivarium-validation-v(?P<version>[^\+]+)$'
git_describe_command = 'git describe --dirty --tags --long --match "vivarium-validation-v*"'
fallback_version = "0.0.0+no-git-tag"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 94
exclude = '''.*examples.*'''

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3
skip_glob = ["*/examples/*", "**/examples/*"]

[tool.mypy]
# WARNING: settings here that aren't mypy_path / explicit_package_bases must be
# kept in sync manually with the monorepo-root [tool.mypy]. The local
# `make mypy` passes --config-file pyproject.toml (this file), so mypy doesn't
# read the root config. If you change the root, change this too.
strict = true
disallow_any_unimported = false
implicit_reexport = true
exclude = [
    "build",
    "docs/source/conf.py",
    "src/vivarium/validation/visualization/plot_utils.py",  # Only stubbed out currently
]
plugins = ["pandera.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# Override mypy for modules that are untyped or not importable in github CI environment
module = [
    "py._path.local",
    "scipy.*",
    "pandera.*",
    "vivarium_inputs.*",
    "vivarium.gbd_mapping.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["vivarium.validation"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
