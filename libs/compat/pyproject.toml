[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "vivarium-compat"
description = "Backward-compatible import redirects for the vivarium monorepo migration."
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dynamic = ["version"]
# No dependencies; the hook redirects imports, it does not depend on them.

[project.optional-dependencies]
test = [
    "vivarium-dependencies[pytest]",
    "vivarium-testing-utils",
]
dev = [
    "vivarium-compat[test]",
    "vivarium-dependencies[lint]",
]
ci_github = ["vivarium-compat[dev]"]
ci_jenkins = ["vivarium-compat[dev]"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Resolve the git root from the monorepo, not this lib directory.
root = "../.."
# Match only this lib's tags so other libs' tags don't drive our version.
tag_regex = '^vivarium-compat-(?P<prefix>v)?(?P<version>[^\+]+)(?P<suffix>.*)?$'
git_describe_command = 'git describe --dirty --tags --long --match "vivarium-compat-v*"'
fallback_version = "0.0.0+unknown"

[tool.hatch.build.hooks.vcs]
version-file = "src/vivarium_compat/_version.py"

[tool.hatch.build.targets.wheel]
# vivarium_compat is a *top-level* package (not under the vivarium namespace).
# This is deliberate: the vivarium_compat.pth startup file imports
# vivarium_compat._compat to install the redirect hook, and if this package
# lived under vivarium, Python would have to run vivarium/__init__.py first -
# which itself imports names that the hook is supposed to redirect, creating
# a bootstrap deadlock during interpreter startup.
sources = ["src"]
only-include = ["src/vivarium_compat"]

# force-include places vivarium_compat.pth at the site-packages root so Python
# executes it at interpreter startup, before any user code runs.
# (setuptools data-files with "" destination goes to sys.prefix, not site-packages.)
[tool.hatch.build.targets.wheel.force-include]
"vivarium_compat.pth" = "vivarium_compat.pth"
