[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium-compat"
version = "0.1.0"
description = "Backward-compatible import redirects for the vivarium monorepo migration."
requires-python = ">=3.10"
# No dependencies — the hook redirects imports, it does not depend on them.

[project.optional-dependencies]
dev = [
    "black",
    "isort",
    "pytest",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
# Installs vivarium_compat.pth to the site-packages root so Python executes
# it at interpreter startup, before any user code runs.
"" = ["vivarium_compat.pth"]
