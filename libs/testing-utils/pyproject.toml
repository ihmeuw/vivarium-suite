[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium-testing-utils"
description = "Project to store testing utilities for Vivarium software."
readme = "README.rst"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dynamic = ["version"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "vivarium-dependencies[numpy,pyyaml,scipy,click,tables,loguru,networkx,pandas]",
    "vivarium-build-utils>=4.0.0,<5.0.0",
    "vivarium-config-tree",
    "pytest-xdist",
    "types-setuptools",
]

[project.optional-dependencies]
cluster = []
test = [
    "vivarium-dependencies[pytest]",
    "pytest-check",
]
docs = ["vivarium-dependencies[sphinx,sphinx-click,ipython,matplotlib,docutils]"]
interactive = ["vivarium-dependencies[interactive]"]
# Internal extra so both `lint` (for mypy's pandera.mypy plugin) and `validation`
# (the runtime feature) can pin pandera from one place.
pandera = ["pandera<0.23.0"]
# `[pandera]` is here so mypy's `pandera.mypy` plugin loads on ci_github (which
# only installs `[test,docs,lint]` and skips `validation`).
lint = ["vivarium-dependencies[lint]", "vivarium-testing-utils[pandera]"]
# Validation feature: pulled in only by Jenkins (ci_jenkins) because
# vivarium-inputs is IHME-artifactory-only and unreachable from GH Actions.
validation = [
    "vivarium-artifact",
    "vivarium-gbd-mapping",
    "vivarium-inputs>=8.0.0,<9.0.0",
    "vivarium-testing-utils[pandera]",
    "pyarrow",
    "seaborn",
    "jinja2>=3.0.0",
]
dev = ["vivarium-testing-utils[test,docs,interactive,lint,validation]"]
ci_github = ["vivarium-testing-utils[test,docs,lint]"]
# Diverges from the sibling convention `[ci_github,cluster]` by adding
# `validation`: Jenkins is the only env that can install vivarium-inputs, so it
# also runs the validation feature's tests + mypy with real types.
ci_jenkins = ["vivarium-testing-utils[ci_github,cluster,validation]"]

[project.entry-points.pytest11]
vivarium_testing_utils = "vivarium.testing_utils.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]
# Only include vivarium.testing_utils and its subpackages. Excluding vivarium
# itself means the wheel does not ship vivarium/__init__.py. The "namespace
# owner" (vivarium-engine) ships the canonical vivarium/__init__.py. If we
# shipped our own here, pip would overwrite the canonical one.
include = ["vivarium.testing_utils", "vivarium.testing_utils.*"]

[tool.setuptools.package-data]
# Ship the py.typed marker (PEP 561) so mypy treats this package as typed when
# users install it from PyPI and so mypy also finds the marker via the
# editable install during in-repo type checks.
"vivarium.testing_utils" = ["py.typed"]

[tool.setuptools_scm]
# Monorepo tagging convention: tags must be prefixed with "vivarium-testing-utils-v"
# (e.g. vivarium-testing-utils-v0.5.4). tag_regex strips the prefix so setuptools_scm
# sees a clean semver; git_describe_command filters to only this lib's tags so siblings'
# releases don't pollute the version derivation.
root = "../.."
tag_regex = '^vivarium-testing-utils-v(?P<version>[^\+]+)$'
git_describe_command = 'git describe --dirty --tags --long --match "vivarium-testing-utils-v*"'
fallback_version = "0.0.0+no-git-tag"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 94
exclude = '''.*examples.*'''

[tool.isort]
profile = "black"
line_length = 94
multi_line_output = 3
skip_glob = ["*/examples/*", "**/examples/*"]

[tool.mypy]
# WARNING: settings here that aren't mypy_path / explicit_package_bases must be
# kept in sync manually with the monorepo-root [tool.mypy]. The local
# `make mypy` passes --config-file pyproject.toml (this file), so mypy doesn't
# read the root config. If you change the root, change this too.
strict = true
disallow_any_unimported = false
implicit_reexport = true
exclude = [
    "build",
    "docs/source/conf.py",
    "src/vivarium/testing_utils/automated_validation/visualization/plot_utils.py",  # Only stubbed out currently
]
plugins = ["pandera.mypy"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
# Two reasons something might land here:
#   1. Upstream lacks py.typed/stubs entirely (scipy, py._path.local, pandera,
#      vivarium-gbd-mapping).
#   2. The dep lives in the `validation` extra and is not installed on
#      ci_github (vivarium-inputs is artifactory-only; vivarium-artifact is
#      pulled in transitively only via `validation`). With this override
#      mypy treats them as Any on ci_github. On Jenkins (which installs
#      `validation`) the imports resolve and mypy uses the real py.typed
#      types — `ignore_missing_imports` is a no-op when the module is
#      actually findable, so this does NOT mask Jenkins type errors.
module = [
    "py._path.local",
    "scipy.*",
    "pandera.*",
    "vivarium_inputs.*",
    "vivarium.artifact.*",
    "vivarium.gbd_mapping.*",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["vivarium.testing_utils"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
