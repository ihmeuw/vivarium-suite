name: "Pull Request Labeler"
on:
  pull_request:
    # 'synchronize' re-runs the labeler on every push to an open PR, so labels
    # stay in sync as files are added or removed (see sync-labels below).
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          sync-labels: true
