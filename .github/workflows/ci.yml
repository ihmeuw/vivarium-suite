name: CI

on:
  push:
    branches:
      - main
      - 'rc/**'
      - 'release-candidate/**'
      - 'release_candidate/**'
      - 'epic/**'
  pull_request:

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      changed-libs: ${{ steps.detect.outputs.changed-libs }}
      releasing-libs: ${{ steps.detect.outputs.releasing-libs }}
      downstream-matrix: ${{ steps.detect.outputs.downstream-matrix }}
      has-downstream: ${{ steps.detect.outputs.has-downstream }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate dependency graph is acyclic
        # Full-graph pre-merge guard: fails the PR if libs/*/pyproject runtime deps
        # form a cycle (the release workflow orders the graph too, but only post-merge).
        run: |
          pip install packaging
          PYTHONPATH=libs/build-utils/src python -m vivarium.build_utils.dependency_graph check-acyclic

      - name: Detect changed packages
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
            git fetch origin "$BASE_REF"
            CHANGED=$(git diff --name-only "origin/${BASE_REF}...${HEAD_REF}")
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
            # Initial push has no 'before' commit; github sets to 40x 0s.
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git rev-list --max-parents=0 HEAD)
            fi
            CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          else
            git fetch origin main
            CHANGED=$(git diff --name-only "origin/main...HEAD")
          fi
          echo "Changed files:"
          echo "$CHANGED"

          ALL_LIBS=$(find libs -maxdepth 1 -mindepth 1 -type d -exec basename {} \; | sort)

          if [ -z "$ALL_LIBS" ]; then
            echo "Warning: no package directories found under libs/"
          fi

          # Determine which packages have source changes in this PR
          SOURCE_CHANGED=()
          for lib in $ALL_LIBS; do
            if echo "$CHANGED" | grep -q "^libs/${lib}/"; then
              SOURCE_CHANGED+=("$lib")
            fi
          done
          # Output the list of changed libraries to the GitHub Actions output for use in subsequent jobs
          echo "changed-libs=${SOURCE_CHANGED[*]}" >> $GITHUB_OUTPUT
          # Human-readable output
          echo "Source-changed libraries: ${SOURCE_CHANGED[*]:-(none)}"

          # Build set: the source-changed libs, or every lib when a shared
          # root/workflow file changes (those affect all packages).
          if echo "$CHANGED" | grep -qE "^(pyproject\.toml|Makefile)$|^\.github/workflows/"; then
            echo "Root-level changes detected - testing all packages"
            BUILD_LIBS=($ALL_LIBS)
          else
            BUILD_LIBS=("${SOURCE_CHANGED[@]}")
          fi

          if [ ${#BUILD_LIBS[@]} -eq 0 ]; then
            echo "No package changes detected"
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "Building matrix for: ${BUILD_LIBS[*]}"
            MATRIX_INCLUDE="["
            FIRST=true
            for lib in "${BUILD_LIBS[@]}"; do
              if [ ! -f "libs/${lib}/python_versions.json" ]; then
                echo "::error::libs/${lib}/python_versions.json not found"
                exit 1
              fi
              VERSIONS=$(python3 -c "import json; [print(v) for v in json.load(open('libs/${lib}/python_versions.json'))]")
              for py in $VERSIONS; do
                [ "$FIRST" = true ] && FIRST=false || MATRIX_INCLUDE+=","
                MATRIX_INCLUDE+="{\"library\":\"${lib}\",\"python-version\":\"${py}\"}"
              done
            done
            MATRIX_INCLUDE+="]"
            echo "matrix={\"include\":${MATRIX_INCLUDE}}" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

          # Release gate: a "releasing" lib is one whose CHANGELOG.rst changed in
          # this diff. Its in-tree dependents (downstream, minus the releasing set
          # itself) are tested against the pending versions so a release can't
          # break a sibling. Non-release PRs have no releasing libs and skip this.
          RELEASING=()
          for lib in $ALL_LIBS; do
            if echo "$CHANGED" | grep -q "^libs/${lib}/CHANGELOG\.rst$"; then
              RELEASING+=("$lib")
            fi
          done
          echo "releasing-libs=${RELEASING[*]}" >> $GITHUB_OUTPUT
          echo "Releasing libraries: ${RELEASING[*]:-(none)}"

          if [ ${#RELEASING[@]} -eq 0 ]; then
            echo "downstream-matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "has-downstream=false" >> $GITHUB_OUTPUT
          else
            DOWNSTREAM=$(PYTHONPATH=libs/build-utils/src python -m vivarium.build_utils.dependency_graph build-downstream-matrix --released "${RELEASING[*]}")
            echo "Downstream matrix: ${DOWNSTREAM}"
            echo "downstream-matrix=${DOWNSTREAM}" >> $GITHUB_OUTPUT
            COUNT=$(echo "$DOWNSTREAM" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['include']))")
            if [ "$COUNT" -eq 0 ]; then
              echo "has-downstream=false" >> $GITHUB_OUTPUT
            else
              echo "has-downstream=true" >> $GITHUB_OUTPUT
            fi
          fi

  build-and-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    # Per-lib recipe lives in the reusable workflow (single source of truth,
    # shared with the downstream-gate below).
    uses: ./.github/workflows/_lib-test.yml
    with:
      library: ${{ matrix.library }}
      python-version: ${{ matrix.python-version }}
      changed-libs: ${{ needs.detect-changes.outputs.changed-libs }}
      run-lint: true
      run-docs: true

  downstream-gate:
    # Release gate: when a PR bumps a lib's CHANGELOG, test that lib's in-tree
    # dependents against the pending version so a release can't break a sibling.
    # Single canonical Python per dependent, test + mypy only (no lint/docs).
    needs: detect-changes
    if: needs.detect-changes.outputs.has-downstream == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.downstream-matrix) }}
    uses: ./.github/workflows/_lib-test.yml
    with:
      library: ${{ matrix.library }}
      python-version: ${{ matrix.python-version }}
      changed-libs: ${{ needs.detect-changes.outputs.releasing-libs }}
      run-lint: false
      run-docs: false

  ci-status:
    name: CI Status
    needs: [detect-changes, build-and-test, downstream-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          BUILD="${{ needs.build-and-test.result }}"
          GATE="${{ needs.downstream-gate.result }}"
          echo "build-and-test: ${BUILD:-<none>} ; downstream-gate: ${GATE:-<none>}"
          # success and skipped both pass; only failure/cancelled fail CI.
          for result in "$BUILD" "$GATE"; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "A required job did not pass"
              exit 1
            fi
          done
          echo "CI passed"

  downstream-alert:
    # Team email only for a real break on main (a merged release broke a
    # dependent). On PRs the red downstream-gate check is the author's signal -
    # no email there, to avoid spamming the team list on every release-PR push.
    name: Downstream break notification
    needs: [detect-changes, downstream-gate]
    if: always() && needs.downstream-gate.result == 'failure' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Send failure notification
        uses: dawidd6/action-send-mail@v2
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.NOTIFY_PASSWORD }}
          subject: "Downstream break on main: releasing ${{ needs.detect-changes.outputs.releasing-libs }}"
          body: "Releasing ${{ needs.detect-changes.outputs.releasing-libs }} broke one or more downstream libraries on main. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          to: uw_ihme_simulationscience@uw.edu
          from: Vivarium Notifications
