name: CI

on:
  push:
    branches:
      - main
      - 'rc/**'
      - 'release-candidate/**'
      - 'release_candidate/**'
      - 'epic/**'
  pull_request:

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
      changed-libs: ${{ steps.detect.outputs.changed-libs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency-graph requirements
        # The dependency_graph CLI is run from in-tree source (see below), so its
        # own runtime dependency has to be installed by hand.
        run: pip install packaging

      - name: Validate dependency graph is acyclic
        # Full-graph pre-merge guard: fails the PR if libs/*/pyproject runtime deps
        # form a cycle (the release workflow orders the graph too, but only post-merge).
        run: PYTHONPATH=libs/build-utils/src python -m vivarium.build_utils.dependency_graph check-acyclic

      - name: Detect changed packages
        id: detect
        # The classification itself (which libs a diff touches, and the matrix to
        # build) lives in the dependency_graph CLI so it can be unit tested; run
        # from in-tree source so a PR editing those rules is tested under them.
        run: |
          CHANGED_FILES="${RUNNER_TEMP}/changed-files.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
            git fetch origin "$BASE_REF"
            git diff --name-only "origin/${BASE_REF}...${HEAD_REF}" > "$CHANGED_FILES"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
            # Initial push has no 'before' commit; github sets to 40x 0s.
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git rev-list --max-parents=0 HEAD)
            fi
            git diff --name-only "$BASE" "$HEAD" > "$CHANGED_FILES"
          else
            git fetch origin main
            git diff --name-only "origin/main...HEAD" > "$CHANGED_FILES"
          fi
          echo "Changed files:"
          cat "$CHANGED_FILES"

          CLASSIFIED=$(PYTHONPATH=libs/build-utils/src python -m vivarium.build_utils.dependency_graph \
            classify-changes --changed-files-file "$CHANGED_FILES")
          echo "Classification:"
          jq . <<< "$CLASSIFIED"

          # changed-libs are the libs to resolve editably from in-tree source; the
          # matrix is what to build, which widens to every lib on a shared-path change.
          echo "changed-libs=$(jq -r '.["source-changed"] | join(" ")' <<< "$CLASSIFIED")" >> $GITHUB_OUTPUT
          echo "matrix=$(jq -c '.matrix' <<< "$CLASSIFIED")" >> $GITHUB_OUTPUT
          echo "has-changes=$(jq -r '.["has-changes"]' <<< "$CLASSIFIED")" >> $GITHUB_OUTPUT

  build-and-test:
    name: ${{ matrix.library }} (Python ${{ matrix.python-version }})
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        # Must precede the local action: `uses: ./...` resolves from the workspace.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ${{ matrix.library }}
        uses: ./.github/actions/lib-ci
        with:
          library: ${{ matrix.library }}
          python-version: ${{ matrix.python-version }}
          # The libraries whose source changed in this PR, so this build resolves them
          # from in-tree source and tests the PR's code rather than what's on PyPI.
          changed-libs: ${{ needs.detect-changes.outputs.changed-libs }}

  ci-status:
    name: CI Status
    needs: [detect-changes, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.detect-changes.outputs.has-changes }}" = "false" ]; then
            echo "No package changes - CI passed"
            exit 0
          elif [ "${{ needs.build-and-test.result }}" = "success" ]; then
            echo "All builds passed"
            exit 0
          elif [ "${{ needs.build-and-test.result }}" = "skipped" ]; then
            echo "No packages to build"
            exit 0
          else
            echo "Some builds failed"
            exit 1
          fi
