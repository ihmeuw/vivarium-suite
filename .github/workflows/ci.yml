name: CI

on:
  push:
    branches:
      - main
      - 'rc/**'
      - 'release-candidate/**'
      - 'release_candidate/**'
      - 'epic/**'
  pull_request:

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      has-changes: ${{ steps.detect.outputs.has-changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: detect
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            HEAD_REF="${{ github.event.pull_request.head.sha }}"
            git fetch origin "$BASE_REF"
            CHANGED=$(git diff --name-only "origin/${BASE_REF}...${HEAD_REF}")
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            BASE="${{ github.event.before }}"
            HEAD="${{ github.event.after }}"
            # Initial push has no 'before' commit; github sets to 40x 0s.
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git rev-list --max-parents=0 HEAD)
            fi
            CHANGED=$(git diff --name-only "$BASE" "$HEAD")
          else
            git fetch origin main
            CHANGED=$(git diff --name-only "origin/main...HEAD")
          fi
          echo "Changed files:"
          echo "$CHANGED"

          ALL_LIBS=$(find libs -maxdepth 1 -mindepth 1 -type d -exec basename {} \; | sort)

          if [ -z "$ALL_LIBS" ]; then
            echo "Warning: no package directories found under libs/"
          fi

          # Root-level changes to shared config or workflows rebuild everything
          if echo "$CHANGED" | grep -qE "^(pyproject\.toml|Makefile)$|^\.github/workflows/"; then
            echo "Root-level changes detected - testing all packages"
            CHANGED_LIBS=($ALL_LIBS)
          else
            CHANGED_LIBS=()
            for lib in $ALL_LIBS; do
              if echo "$CHANGED" | grep -q "^libs/${lib}/"; then
                echo "Changes detected in ${lib}"
                CHANGED_LIBS+=("$lib")
              fi
            done
          fi

          if [ ${#CHANGED_LIBS[@]} -eq 0 ]; then
            echo "No package changes detected"
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "has-changes=false" >> $GITHUB_OUTPUT
          else
            echo "Building matrix for: ${CHANGED_LIBS[*]}"
            MATRIX_INCLUDE="["
            FIRST=true
            for lib in "${CHANGED_LIBS[@]}"; do
              if [ ! -f "libs/${lib}/python_versions.json" ]; then
                echo "::error::libs/${lib}/python_versions.json not found"
                exit 1
              fi
              VERSIONS=$(python3 -c "import json; [print(v) for v in json.load(open('libs/${lib}/python_versions.json'))]")
              for py in $VERSIONS; do
                [ "$FIRST" = true ] && FIRST=false || MATRIX_INCLUDE+=","
                MATRIX_INCLUDE+="{\"library\":\"${lib}\",\"python-version\":\"${py}\"}"
              done
            done
            MATRIX_INCLUDE+="]"
            echo "matrix={\"include\":${MATRIX_INCLUDE}}" >> $GITHUB_OUTPUT
            echo "has-changes=true" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    name: ${{ matrix.library }} (Python ${{ matrix.python-version }})
    needs: detect-changes
    if: needs.detect-changes.outputs.has-changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install vivarium_build_utils
        # FIXME[MIC-7015]: Update to main once develop/monorepo is merged
        run: uv pip install --system "vivarium_build_utils @ git+https://github.com/ihmeuw/vivarium_build_utils.git@develop/monorepo"

      - name: Install ${{ matrix.library }}
        run: cd libs/${{ matrix.library }} && uv pip install --system -e ".[dev]"

      - name: Lint ${{ matrix.library }}
        run: cd libs/${{ matrix.library }} && make lint

      - name: Mypy ${{ matrix.library }}
        run: |
          if find "libs/${{ matrix.library }}/src" -name "py.typed" | grep -q .; then
            cd libs/${{ matrix.library }} && make mypy
          else
            echo "Untyped package, skipping mypy"
          fi

      - name: Test ${{ matrix.library }}
        run: cd libs/${{ matrix.library }} && make test-all

      - name: Build docs for ${{ matrix.library }}
        run: |
          # 3.11 is the minimum version all packages support; use it as the canonical docs build
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            cd libs/${{ matrix.library }} && make build-docs
          else
            echo "Skipping docs build (only runs on 3.11)"
          fi

  ci-status:
    name: CI Status
    needs: [detect-changes, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          if [ "${{ needs.detect-changes.outputs.has-changes }}" = "false" ]; then
            echo "No package changes - CI passed"
            exit 0
          elif [ "${{ needs.build-and-test.result }}" = "success" ]; then
            echo "All builds passed"
            exit 0
          elif [ "${{ needs.build-and-test.result }}" = "skipped" ]; then
            echo "No packages to build"
            exit 0
          else
            echo "Some builds failed"
            exit 1
          fi
