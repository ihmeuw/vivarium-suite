# Downstream release gate for PRs into main.
#
# When a PR bumps a library's version (its CHANGELOG.rst), that library's in-tree
# dependents are tested against the *pending* version so a release can't break a
# sibling. The expensive fan-out runs only on demand - add the `run-downstream`
# label (or run this workflow manually) when the PR is ready to merge.
#
# The `downstream-status` job is the required status check on main: every PR into
# main runs the downstream check before merging. It stays red ("add the
# run-downstream label") until the check has run for the PR, then reflects the
# results. A PR with no in-tree dependents passes as a no-op once run.
name: Downstream Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: downstream-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect downstream libraries
    runs-on: ubuntu-latest
    outputs:
      releasing-libs: ${{ steps.detect.outputs.releasing-libs }}
      downstream-matrix: ${{ steps.detect.outputs.downstream-matrix }}
      has-downstream: ${{ steps.detect.outputs.has-downstream }}
      # "Was the downstream check requested?" - the run-downstream label or a manual
      # dispatch. Computed once here so the fan-out and the required-check agree.
      requested: ${{ contains(github.event.pull_request.labels.*.name, 'run-downstream') || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect releasing libraries and their downstream dependents
        id: detect
        run: |
          pip install packaging
          CHANGED_FILES="${RUNNER_TEMP}/changed-files.txt"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.event.pull_request.base.ref }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            git fetch origin "$BASE_REF"
            git diff --name-only "origin/${BASE_REF}...${HEAD_SHA}" > "$CHANGED_FILES"
          else
            git fetch origin main
            git diff --name-only "origin/main...HEAD" > "$CHANGED_FILES"
          fi

          # A "releasing" lib is one whose CHANGELOG.rst changed in this PR.
          CLASSIFIED=$(PYTHONPATH=libs/build-utils/src python -m vivarium.build_utils.dependency_graph \
            classify-changes --changed-files-file "$CHANGED_FILES")
          RELEASING=$(jq -r '.releasing | join(" ")' <<< "$CLASSIFIED")
          echo "releasing-libs=${RELEASING}" >> $GITHUB_OUTPUT
          echo "Releasing libraries: ${RELEASING:-(none)}"

          # An empty --released yields an empty include, so no short-circuit is needed.
          DOWNSTREAM=$(PYTHONPATH=libs/build-utils/src python -m vivarium.build_utils.dependency_graph \
            build-downstream-matrix --released "$RELEASING")
          echo "Downstream matrix: ${DOWNSTREAM}"
          echo "downstream-matrix=${DOWNSTREAM}" >> $GITHUB_OUTPUT
          echo "has-downstream=$(jq -r '.include | length > 0' <<< "$DOWNSTREAM")" >> $GITHUB_OUTPUT

  downstream:
    # The fan-out: run each dependent's tests against the releasing libs installed
    # editably at their pending versions. Runs only when there ARE dependents AND
    # the run was requested (the label is present, or a manual dispatch).
    needs: detect
    if: needs.detect.outputs.has-downstream == 'true' && needs.detect.outputs.requested == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.downstream-matrix) }}
    steps:
      - name: Checkout code
        # Must precede the local action: `uses: ./...` resolves from the workspace.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check ${{ matrix.library }} against the releasing libraries
        uses: ./.github/actions/lib-ci
        with:
          library: ${{ matrix.library }}
          python-version: ${{ matrix.python-version }}
          # The releasing lib(s), resolved editably from in-tree source at their
          # *pending* versions, so this dependent is checked against the
          # about-to-be-released code. The shared recipe's docs steps matter here:
          # a release can break a dependent through its docs, since cross-references
          # resolve into the upstream package under warnings-as-errors and doctests
          # execute against the newly installed version.
          changed-libs: ${{ needs.detect.outputs.releasing-libs }}

  downstream-status:
    # The required status check on main. Red until the check is requested (the
    # run-downstream label or a manual dispatch); once requested it passes when the
    # PR has no in-tree dependents or the downstream fan-out succeeded.
    name: downstream-status
    needs: [detect, downstream]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report downstream status
        run: |
          DETECT="${{ needs.detect.result }}"
          HAS="${{ needs.detect.outputs.has-downstream }}"
          RESULT="${{ needs.downstream.result }}"
          REQUESTED="${{ needs.detect.outputs.requested }}"

          # Fail loudly on an infrastructure failure in detect: its empty outputs
          # would otherwise read as "no dependents" and pass the required check blindly.
          if [ "$DETECT" != "success" ]; then
            echo "::error::detect job did not succeed (result: ${DETECT}); cannot determine downstream dependents."
            exit 1
          fi
          if [ "$REQUESTED" != "true" ]; then
            echo "::error::Add the 'run-downstream' label (or run the Downstream Check workflow manually) to run the downstream check before merging into main."
            exit 1
          fi
          if [ "$HAS" != "true" ]; then
            echo "Downstream check ran: this PR has no in-tree dependents to test."
            exit 0
          fi
          if [ "$RESULT" = "success" ]; then
            echo "Downstream check passed."
            exit 0
          fi
          echo "::error::Downstream check did not pass (downstream job: ${RESULT})."
          exit 1
