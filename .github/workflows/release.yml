# Expected CHANGELOG.rst first-line format: "**X.Y.Z - MM/DD/YY**"
# Both the detect job (version parsing) and the release job (date validation) depend on this.
name: Release

on:
  push:
    branches: [main]
    paths: ['libs/*/CHANGELOG.rst']
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory under libs/ (e.g. core, config-tree)'
        required: true
        type: string
      version:
        description: 'Version to release (e.g. 4.1.0)'
        required: true
        type: string
  release:
    types: [published]

jobs:
  detect:
    name: Detect Packages to Release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.order.outputs.matrix }}
      has-releases: ${{ steps.order.outputs.has-releases }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect packages to release
        # Writes "<lib> <version>" lines to package_versions.txt
        env:
          PACKAGE: ${{ github.event.inputs.package }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          rm -f package_versions.txt
          touch package_versions.txt
          # The git tag prefix is the package's PyPI dist name (pyproject
          # [project].name), which is NOT always "vivarium-<dir>" - e.g. the
          # pytest-vivarium plugin. Parse it with tomllib (same as the release
          # matrix's own resolver) so it is [project]-scoped and raises loudly on
          # a missing/malformed pyproject rather than silently yielding an empty
          # tag prefix. Requires the "Set up Python" step to run first.
          get_dist() { python -c "import tomllib,sys; print(tomllib.load(open(f'libs/{sys.argv[1]}/pyproject.toml','rb'))['project']['name'])" "$1"; }
          if [ "${{ github.event_name }}" = "release" ]; then
            # Tag was created by the GitHub UI release. Parse it to find the lib and version.
            # Tag format: "<dist>-v<X.Y.Z>" where <dist> is a lib's [project].name.
            TAG_NAME="${{ github.event.release.tag_name }}"
            if [[ ! "$TAG_NAME" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "Tag '${TAG_NAME}' does not match '<dist>-v<X.Y.Z>'"
              exit 1
            fi
            DIST="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"

            # Find the libs/<dir> whose pyproject [project].name equals DIST.
            # Dist names are unique across libs, so the first match is the one.
            LIBRARY=""
            for d in libs/*/; do
              [ -f "${d}pyproject.toml" ] || continue
              if [ "$(get_dist "$(basename "$d")")" = "$DIST" ]; then
                LIBRARY="$(basename "$d")"
                break
              fi
            done
            if [ -z "$LIBRARY" ]; then
              echo "Could not find a libs/<dir> with [project].name == '${DIST}'"
              exit 1
            fi

            echo "${LIBRARY} ${VERSION}" >> package_versions.txt
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual release.yml dispatch. Validate inputs and use them directly.
            if [ ! -d "libs/${PACKAGE}" ]; then
              echo "Package directory 'libs/${PACKAGE}' does not exist"
              exit 1
            fi

            DIST="$(get_dist "$PACKAGE")"
            TAG="${DIST}-v${VERSION}"
            if git tag -l "$TAG" | grep -q .; then
              echo "Tag $TAG already exists"
              exit 1
            fi

            echo "${PACKAGE} ${VERSION}" >> package_versions.txt
          else
            # Push to main. Detect all changed CHANGELOG.rst files and parse versions.
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE=$(git rev-list --max-parents=0 HEAD)
            fi

            CHANGED_CHANGELOGS=$(git diff --name-only "$BEFORE" "$AFTER" | grep '^libs/.*/CHANGELOG\.rst$' || true)

            while IFS= read -r changelog; do
              [ -z "$changelog" ] && continue
              LIB=$(echo "$changelog" | sed 's|libs/||; s|/CHANGELOG.rst||')
              VERSION=$(head -1 "libs/${LIB}/CHANGELOG.rst" | grep -oP '[0-9]+\.[0-9]+\.[0-9]+' | head -1)

              if [ -z "$VERSION" ]; then
                echo "Could not parse version from libs/${LIB}/CHANGELOG.rst"
                exit 1
              fi

              DIST="$(get_dist "$LIB")"
              TAG="${DIST}-v${VERSION}"
              if git tag -l "$TAG" | grep -q .; then
                echo "Tag $TAG already exists, skipping"
                continue
              fi

              echo "${LIB} ${VERSION}" >> package_versions.txt
            done <<< "$CHANGED_CHANGELOGS"
          fi
          echo "Collected package versions:"; cat package_versions.txt

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install vivarium_build_utils
        # Editable from the in-tree checkout so the release ordering is computed
        # by THIS push's dependency graph/resolver (vbu may itself be in the batch)
        run: |
          python -m pip install uv
          uv pip install --system -e libs/build-utils

      - name: Order releases dependencies-first
        id: order
        # vivarium.build_utils.dependency_graph builds the matrix ordered
        # dependencies-first; each entry carries the in-batch upstreams it must
        # wait for on PyPI. Fails loudly on a cycle or a missing version.
        run: |
          matrix=$(python -m vivarium.build_utils.dependency_graph build-release-matrix --versions package_versions.txt)
          echo "Ordered release matrix: ${matrix}"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          if [ "$(echo "$matrix" | jq '.include | length')" -eq 0 ]; then
            echo "has-releases=false" >> "$GITHUB_OUTPUT"
          else
            echo "has-releases=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release ${{ matrix.library }} v${{ matrix.version }}
    needs: detect
    if: needs.detect.outputs.has-releases == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      # Jobs run concurrently; the matrix is ordered dependencies-first and each
      # job waits for its in-batch upstreams on PyPI before installing. Independent
      # packages release in parallel
      # fail-fast=false so one package's failure does not cancel unrelated releases
      fail-fast: false
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Validate CHANGELOG date
        run: |
          # Date is checked against Pacific time to match IHME's release conventions
          # CHANGELOG format is "X.Y.Z - MM/DD/YY" (2-digit year)
          # (?!\d) prevents partial match if a CHANGELOG still uses a 4-digit year
          CHANGELOG_DATE=$(head -1 "libs/${{ matrix.library }}/CHANGELOG.rst" | grep -oP '\d{2}/\d{2}/\d{2}(?!\d)')
          TODAY=$(TZ='America/Los_Angeles' date +%m/%d/%y)
          if [ "$CHANGELOG_DATE" != "$TODAY" ]; then
            echo "CHANGELOG date ($CHANGELOG_DATE) does not match today ($TODAY)"
            exit 1
          fi

      - name: Install vivarium_build_utils
        # Editable from the in-tree checkout so the release ordering is computed
        # by THIS push's dependency graph/resolver (vbu may itself be in the batch)
        run: |
          python -m pip install uv
          uv pip install --system -e libs/build-utils

      - name: Validate tag
        # Runs before the tag is created so a bad version never reaches origin.
        # `make validate-tag` reads RELEASE_TAG as the tag, falling back to
        # GITHUB_REF_NAME. We can't override GITHUB_REF_NAME via a step env
        # block (GitHub Actions reserves the GITHUB_* namespace), so we set
        # RELEASE_TAG explicitly. TAG_PREFIX tells the script to strip the
        # lib-prefix before semver parsing and to scope the previous-tag
        # lookup to this lib's tags. Validation is independent of whether the
        # tag exists yet (it injects RELEASE_VERSION into the bump check).
        env:
          RELEASE_TAG: ${{ matrix.dist }}-v${{ matrix.version }}
          TAG_PREFIX: ${{ matrix.dist }}-
        run: cd libs/${{ matrix.library }} && make validate-tag

      - name: Create and push tag
        env:
          TAG_PREFIX: ${{ matrix.dist }}-
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Pass matrix.version explicitly so the tag uses the same version the
          # detect job parsed, rather than re-deriving it from CHANGELOG.rst.
          cd libs/${{ matrix.library }} && make tag-version PACKAGE_VERSION=${{ matrix.version }}

      - name: Wait for upstream releases
        run: |
          python - <<'PY'
          import json, subprocess, sys, time
  
          TIMEOUT_SECONDS = 300  # per upstream; PyPI propagation can lag a publish by a minute+
          POLL_SECONDS = 15
  
          wait_for = json.loads(r'''${{ toJson(matrix.wait_for) }}''')
          if not wait_for:
              print("No in-batch upstreams to wait for.")
              sys.exit(0)
  
          for upstream in wait_for:
              spec = f"{upstream['dist']}=={upstream['version']}"
              print(f"Waiting for {spec} on PyPI...")
              deadline = time.time() + TIMEOUT_SECONDS
              while True:
                  installable = subprocess.run(
                      ["uv", "pip", "install", "--system", "--dry-run",
                       "--no-deps", "--no-cache", spec],
                      capture_output=True,
                  ).returncode == 0
                  if installable:
                      print(f"  {spec} is installable.")
                      break
                  if time.time() >= deadline:
                      print(f"::error::timed out ({TIMEOUT_SECONDS}s) waiting for {spec} on PyPI")
                      sys.exit(1)
                  time.sleep(POLL_SECONDS)
          PY

      - name: Install ${{ matrix.library }}
        # IHME_PYPI= (a blank) disables the GitHub Enterprise extra-index since the
        # runner can't reach it (firewalled); libs that need packages hosted there
        # are tested/released via Jenkins. Upstreams are guaranteed installable
        # by the wait gate above, so this resolves them from PyPI normally.
        # Only use pip cache on push/PR, not on release
        run: cd libs/${{ matrix.library }} && make install ENV_REQS=ci_github UV_FLAGS='--system --no-cache' IHME_PYPI=

      - name: Run tests
        run: cd libs/${{ matrix.library }} && make test-all

      - name: Build
        run: cd libs/${{ matrix.library }} && make build-package

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: libs/${{ matrix.library }}/dist/
          # Skip (don't fail) if the version is already on PyPI - e.g. a manual
          # re-run of an already-published entry in a concurrent batch.
          skip-existing: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ matrix.dist }}-v${{ matrix.version }}"
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" \
            --title "${{ matrix.dist }} v${{ matrix.version }}" \
            --generate-notes

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v2
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.NOTIFY_PASSWORD }}
          subject: ${{ github.job }} job of ${{ github.repository }} has ${{ job.status }}
          body: ${{ github.job }} job in workflow ${{ github.workflow }} of ${{ github.repository }} has ${{ job.status }}
          to: uw_ihme_simulationscience@uw.edu
          from: Vivarium Notifications
