# Expected CHANGELOG.rst first-line format: "**X.Y.Z - MM/DD/YY**"
# Both the detect job (version parsing) and the release job (date validation) depend on this.
name: Release

on:
  push:
    branches: [main]
    paths: ['libs/*/CHANGELOG.rst']
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory under libs/ (e.g. core, config-tree)'
        required: true
        type: string
      version:
        description: 'Version to release (e.g. 4.1.0)'
        required: true
        type: string
  release:
    types: [published]

jobs:
  detect:
    name: Detect Packages to Release
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.order.outputs.matrix }}
      has-releases: ${{ steps.order.outputs.has-releases }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect packages to release
        id: detect
        env:
          PACKAGE: ${{ github.event.inputs.package }}
          VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            # Tag was created by the GitHub UI release. Parse it to find the lib and version.
            # Tag format: "vivarium-<lib>-v<X.Y.Z>" where <lib> matches the libs/<lib>/ dir.
            TAG_NAME="${{ github.event.release.tag_name }}"
            if [[ ! "$TAG_NAME" =~ ^vivarium-(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "Tag '${TAG_NAME}' does not match 'vivarium-<lib>-v<X.Y.Z>'"
              exit 1
            fi
            LIBRARY="${BASH_REMATCH[1]}"
            VERSION="${BASH_REMATCH[2]}"

            if [ ! -d "libs/${LIBRARY}" ]; then
              echo "Could not find lib directory 'libs/${LIBRARY}'"
              exit 1
            fi

            echo "${LIBRARY} ${VERSION}" >> release_pairs.txt
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual release.yml dispatch. Validate inputs and use them directly.
            if [ ! -d "libs/${PACKAGE}" ]; then
              echo "Package directory 'libs/${PACKAGE}' does not exist"
              exit 1
            fi

            TAG="vivarium-${PACKAGE}-v${VERSION}"
            if git tag -l "$TAG" | grep -q .; then
              echo "Tag $TAG already exists"
              exit 1
            fi

            echo "${PACKAGE} ${VERSION}" >> release_pairs.txt
          else
            # Push to main. Detect all changed CHANGELOG.rst files and parse versions.
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.event.after }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE=$(git rev-list --max-parents=0 HEAD)
            fi

            CHANGED_CHANGELOGS=$(git diff --name-only "$BEFORE" "$AFTER" | grep '^libs/.*/CHANGELOG\.rst$' || true)

            while IFS= read -r changelog; do
              [ -z "$changelog" ] && continue
              LIB=$(echo "$changelog" | sed 's|libs/||; s|/CHANGELOG.rst||')
              VERSION=$(head -1 "libs/${LIB}/CHANGELOG.rst" | grep -oP '[0-9]+\.[0-9]+\.[0-9]+' | head -1)

              if [ -z "$VERSION" ]; then
                echo "Could not parse version from libs/${LIB}/CHANGELOG.rst"
                exit 1
              fi

              TAG="vivarium-${LIB}-v${VERSION}"
              if git tag -l "$TAG" | grep -q .; then
                echo "Tag $TAG already exists, skipping"
                continue
              fi

              echo "${LIB} ${VERSION}" >> release_pairs.txt
            done <<< "$CHANGED_CHANGELOGS"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Install vivarium_build_utils
        # FIXME: Update to main once epic/monorepo is merged
        run: uv pip install --system "vivarium_build_utils @ git+https://github.com/ihmeuw/vivarium_build_utils.git@epic/monorepo"

      - name: Order releases dependencies-first
        id: order
        run: |
          # Order the batch so each dependency releases (and becomes installable
          # on PyPI) before any dependent. Edges follow runtime + ci_github deps -
          # the dependency set the release install activates - and the vbu helper
          # fails loudly on a cycle. The release job runs this order with
          # max-parallel=1 so dependents only start once their deps are published.
          if [ ! -s release_pairs.txt ]; then
            echo "No packages to release"
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
            echo "has-releases=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          LIBS=$(cut -d' ' -f1 release_pairs.txt)
          ORDERED=$(python -m vivarium_build_utils.dependencies topo $LIBS --extra ci_github)
          MATRIX_INCLUDE="["
          FIRST=true
          while read -r lib; do
            [ -z "$lib" ] && continue
            # Look the version back up from the pairs file (first column match).
            version=$(awk -v target="$lib" '$1 == target { print $2; exit }' release_pairs.txt)
            [ "$FIRST" = true ] && FIRST=false || MATRIX_INCLUDE+=","
            MATRIX_INCLUDE+="{\"library\":\"${lib}\",\"version\":\"${version}\"}"
          done <<< "$ORDERED"
          MATRIX_INCLUDE+="]"
          echo "Ordered release matrix: ${MATRIX_INCLUDE}"
          echo "matrix={\"include\":${MATRIX_INCLUDE}}" >> $GITHUB_OUTPUT
          echo "has-releases=true" >> $GITHUB_OUTPUT

  release:
    name: Release ${{ matrix.library }} v${{ matrix.version }}
    needs: detect
    if: needs.detect.outputs.has-releases == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      # Sequential, dependency-ordered releases (the detect job emits the matrix
      # deps-first). max-parallel=1 runs them one at a time in that order;
      # fail-fast halts the chain if a dependency release fails so dependents
      # don't publish against a missing/unreleased version.
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v4

      - name: Validate CHANGELOG date
        run: |
          # Date is checked against Pacific time to match IHME's release conventions
          # CHANGELOG format is "X.Y.Z - MM/DD/YY" (2-digit year)
          # (?!\d) prevents partial match if a CHANGELOG still uses a 4-digit year
          CHANGELOG_DATE=$(head -1 "libs/${{ matrix.library }}/CHANGELOG.rst" | grep -oP '\d{2}/\d{2}/\d{2}(?!\d)')
          TODAY=$(TZ='America/Los_Angeles' date +%m/%d/%y)
          if [ "$CHANGELOG_DATE" != "$TODAY" ]; then
            echo "CHANGELOG date ($CHANGELOG_DATE) does not match today ($TODAY)"
            exit 1
          fi

      - name: Install vivarium_build_utils
        # Install early so `make validate-tag` is available
        # FIXME: Update to main once epic/monorepo is merged
        run: uv pip install --system "vivarium_build_utils @ git+https://github.com/ihmeuw/vivarium_build_utils.git@epic/monorepo"

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vivarium-${{ matrix.library }}-v${{ matrix.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git tag -l "$TAG" | grep -q .; then
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Validate tag
        # `make validate-tag` reads RELEASE_TAG as the tag, falling back to
        # GITHUB_REF_NAME. We can't override GITHUB_REF_NAME via a step env
        # block (GitHub Actions reserves the GITHUB_* namespace), so we set
        # RELEASE_TAG explicitly. TAG_PREFIX tells the script to strip the
        # lib-prefix before semver parsing and to scope the previous-tag
        # lookup to this lib's tags.
        env:
          RELEASE_TAG: vivarium-${{ matrix.library }}-v${{ matrix.version }}
          TAG_PREFIX: vivarium-${{ matrix.library }}-
        run: cd libs/${{ matrix.library }} && make validate-tag

      - name: Install ${{ matrix.library }}
        # IHME_PYPI= disables the artifactory extra-index since the runner can't
        # reach it (firewalled). Libs that need artifactory-only packages
        # are tested/released via Jenkins.
        run: cd libs/${{ matrix.library }} && make install ENV_REQS=ci_github UV_FLAGS=--system IHME_PYPI=

      - name: Run tests
        run: cd libs/${{ matrix.library }} && make test-all

      - name: Build
        run: cd libs/${{ matrix.library }} && make build-package

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: libs/${{ matrix.library }}/dist/

      - name: Wait for PyPI availability
        # A freshly published version is often installable within seconds, but
        # propagation can take a minute or two. Check immediately, then retry
        # every 15s up to ~2 min, so the next (dependent) release in the ordered,
        # serialized matrix can install it from real PyPI.
        run: |
          PKG="vivarium-${{ matrix.library }}"
          VER="${{ matrix.version }}"
          MAX_ATTEMPTS=9  # 1 immediate try + 8 retries * 15s = up to ~2 min
          echo "Waiting for ${PKG}==${VER} to be installable from PyPI..."
          attempt=1
          while true; do
            if uv pip install --system --dry-run --no-deps "${PKG}==${VER}" >/dev/null 2>&1; then
              echo "${PKG}==${VER} is installable."
              exit 0
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "Timed out after ~2 min waiting for ${PKG}==${VER} on PyPI"
              exit 1
            fi
            echo "  not visible yet (attempt ${attempt}/${MAX_ATTEMPTS}); sleeping 15s"
            attempt=$((attempt + 1))
            sleep 15
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="vivarium-${{ matrix.library }}-v${{ matrix.version }}"
          gh release view "$TAG" 2>/dev/null || gh release create "$TAG" \
            --title "vivarium-${{ matrix.library }} v${{ matrix.version }}" \
            --generate-notes

      - name: Send failure notification
        if: failure()
        uses: dawidd6/action-send-mail@v2
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.NOTIFY_EMAIL }}
          password: ${{ secrets.NOTIFY_PASSWORD }}
          subject: ${{ github.job }} job of ${{ github.repository }} has ${{ job.status }}
          body: ${{ github.job }} job in workflow ${{ github.workflow }} of ${{ github.repository }} has ${{ job.status }}
          to: uw_ihme_simulationscience@uw.edu
          from: Vivarium Notifications
